<!doctype html>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!--
      Тема применяется ДО первой отрисовки — иначе тёмная тема моргает белым.
      Логика синхронизирована с src/context/ThemeContext.jsx.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = dark ? '#100F0D' : '#F5EFE4';
        } catch (e) { /* приватный режим — просто оставляем светлую тему */ }
      })();
    </script>

    <!--
      Шрифты дизайн-системы REGISTAN.

      Все три содержат полную кириллицу — это жёсткое требование
      для русскоязычного журнала. Красивые Fraunces и Newsreader
      пришлось отвергнуть именно по этой причине: латиница у них
      отличная, а на русском тексте браузер молча подставляет
      системный шрифт, и заголовки набираются не тем, чем задумано.

        Literata      — заголовки и акциденция (вариативная, ось opsz)
        Golos Text    — основной текст (гротеск Паратайпа, кириллица родная)
        JetBrains Mono — метаданные, цифры, код
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..600&family=Golos+Text:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
